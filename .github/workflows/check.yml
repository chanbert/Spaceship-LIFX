name: Cross-platform checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Test with preinstalled Python (no dependency downloads)
        run: python3 -m unittest discover -v
      - name: Test light configuration interaction
        run: node --test tests/light-settings.test.cjs
